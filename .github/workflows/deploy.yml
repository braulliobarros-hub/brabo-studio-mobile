name: Publicar Brabo Studio (web)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-e-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env
          echo "EXPO_ROUTER_DISABLE_RN_NAVIGATION_CHECK=1" >> .env
      - run: npx expo export --platform web
      - name: Fundo escuro no HTML (evita flash branco ao carregar/navegar)
        run: |
          sed -i 's|</head>|<style>html,body,#root{background-color:#050506!important;}</style><meta name="theme-color" content="#050506"></head>|' dist/index.html
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
